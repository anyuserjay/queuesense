<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QueueSense</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--mut:#667085;--acc:#4f46e5;--ok:#16a34a;--line:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--ink:#eef0f6;--mut:#9aa3b5;--line:#2a3142}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--ink:#eef0f6;--mut:#9aa3b5;--line:#2a3142}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1,h2{margin:.2em 0}.mut{color:var(--mut)}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.grid .card{margin:0}
.big{font-size:2.1rem;font-weight:700}button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:1rem;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);margin:3px}
input,select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;max-width:100%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td input{width:70px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}.bars div{flex:1;background:var(--line);border-radius:4px 4px 0 0;min-height:3px}
.bars .q{background:var(--ok)}.bars .now{outline:2px solid var(--acc)}.lbl{display:flex;gap:3px;font-size:.65rem;color:var(--mut)}.lbl span{flex:1;text-align:center}
.err{color:#dc2626}a{color:var(--acc);cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:8px}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=m=>m>=60?Math.floor(m/60)+" h "+(m%60)+" min":m+" min";
const K="qs1";let S={offices:{},workers:{}},me=null,err="",draft=[];
const PRE={"Canteen":[["Samosa",10],["Dosa",20],["Tea",3],["Sandwich",8],["Thali",12]],
"Hospital":[["Eye strain check-up",30],["General consultation",15],["Blood test",10],["X-ray",20],["Prescription pickup",5]],
"Administrative office":[["Aadhar update",15],["Certificate request",10],["Form submission",5],["Fee payment",5],["Document verification",10]],
"Cafe":[["Coffee",5],["Cold coffee",7],["Sandwich",8],["Pastry",3],["Smoothie",6]],
"Custom":[["General service",10]]};
const ld=()=>{try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
try{me=localStorage.getItem("qs_me")}catch(e){}
ld();
const today=()=>new Date().toDateString();
const off=c=>{const o=S.offices[c];if(o&&o.day!==today()){o.tokens=[];o.last=0;o.day=today()}return o};
async function hash(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* Your original idea, upgraded: the wait for a token = sum of the times of the tokens ahead of it */
function snap(o){const now=Date.now();let acc=0;
const seen={},list=o.tokens.filter(t=>t.status!=="done").sort((a,b)=>a.num-b.num).map(t=>{
let b=0,e=0;(t.items||[]).forEach(x=>{const mi=o.menu.find(m=>m.id===x.id),c=mi&&mi.c||1,key=x.id||"c:"+x.name,k=seen[key]=(seen[key]||0)+1;b+=x.mins;e+=(k-1)%c===0?x.mins:x.mins/5});
const eff=b?t.mins*e/b:t.mins;
const rem=t.status==="serving"?Math.max(1,eff-(now-t.started)/6e4):eff;
const r={...t,eff:Math.max(1,Math.round(eff)),wait:Math.round(acc)};acc+=rem;return r});
return{list,serving:list.find(t=>t.status==="serving"),total:Math.round(acc)}}
function hours(o){const c=Array(24).fill(0),d=new Set(),lim=Date.now()-14*864e5;
(o.log||[]).forEach(t=>{if(t>lim){const x=new Date(t);c[x.getHours()]++;d.add(x.toDateString())}});
const n=Math.max(1,d.size);return c.map(x=>+(x/n).toFixed(1))}

/* worker actions */
function summary(it){const c={};it.forEach(x=>c[x.name]=(c[x.name]||0)+1);return Object.entries(c).map(([n,k])=>k>1?n+" ×"+k:n).join(" + ")}
function addTok(o,it){o.last=(o.last||0)+1;const now=Date.now(),busy=o.tokens.some(t=>t.status==="serving");
o.tokens.push({id:now+Math.random(),num:o.last,items:it,label:summary(it),mins:Math.max(1,it.reduce((a,x)=>a+x.mins,0)),status:busy?"waiting":"serving",started:busy?null:now});
(o.log=o.log||[]).push(now);sv()}
function next(o){const now=Date.now();o.tokens.forEach(t=>{if(t.status==="serving")t.status="done"});
const n=o.tokens.filter(t=>t.status==="waiting").sort((a,b)=>a.num-b.num)[0];if(n){n.status="serving";n.started=now}sv()}
const me_o=()=>off(S.workers[me]&&S.workers[me].code);
const A={
add(id){const m=me_o().menu.find(x=>x.id===id);draft.push({id:m.id,name:m.name,mins:m.mins});go()},
custom(){const m=+$("#cm").value;if(!m)return;draft.push({id:null,name:$("#cl").value||"Custom",mins:m});go()},
undraft(i){draft.splice(i,1);go()},
clear(){draft=[];go()},
create(){if(!draft.length)return;addTok(me_o(),draft);draft=[];go()},
edit(id,v){const t=me_o().tokens.find(x=>x.id==id);t.mins=Math.max(1,+v||1);sv();go()},
del(id){const o=me_o(),t=o.tokens.find(x=>x.id==id);o.tokens=o.tokens.filter(x=>x.id!=id);if(t&&t.status==="serving")next(o);sv();go()},
next(){next(me_o());go()},
delay(){const o=me_o(),id=$("#di").value,m=Math.max(0,+$("#dm").value||0),c=+$("#dc").value||0;if(!m&&!c)return;
const mi=o.menu.find(x=>x.id===id),old=mi.mins;if(c)mi.c=Math.max(1,c);if(!m){sv();go();return}mi.mins=m;
o.tokens.forEach(t=>{if(t.status==="done")return;const k=(t.items||[]).filter(x=>x.id===id).length;if(k){t.items.forEach(x=>{if(x.id===id)x.mins=m});t.mins=Math.max(1,t.mins+k*(m-old))}});sv();go()},
item(){const o=me_o(),n=$("#nn").value,m=+$("#nm").value;if(!n||!m)return;o.menu.push({id:"m"+Date.now(),name:n,mins:m,c:Math.max(1,+$("#nc").value||1)});sv();go()},
cnt(v){me_o().counters=Math.max(1,+v||1);sv();go()},
demo(){const o=me_o(),L={8:3,9:5,10:4,11:7,12:18,13:20,14:8,15:3,16:4,17:9,18:5};o.log=o.log||[];
for(let d=1;d<=7;d++)for(const h in L){const n=Math.max(0,L[h]+Math.floor(Math.random()*4)-1);
for(let i=0;i<n;i++){const t=new Date();t.setDate(t.getDate()-d);t.setHours(+h,Math.floor(Math.random()*60));o.log.push(t.getTime())}}sv();go()},
async reg(){const u=$("#u").value.trim(),p=$("#p").value,n=$("#n").value.trim(),ty=$("#ty").value;err="";
if(!u||!n||p.length<4)err="Fill all fields (password 4+ characters).";else if(S.workers[u])err="Username already taken.";
else{let c;do c=Math.random().toString(36).slice(2,8).toUpperCase();while(S.offices[c]);
S.offices[c]={name:n,type:ty,code:c,counters:1,day:today(),last:0,tokens:[],log:[],menu:PRE[ty].map((x,i)=>({id:"m"+i,name:x[0],mins:x[1],c:1}))};
S.workers[u]={pw:await hash(p),code:c};sv();login(u);return}go()},
async login(){const u=$("#u").value.trim(),w=S.workers[u];err="";
if(w&&w.pw===await hash($("#p").value)){login(u);return}err="Wrong username or password.";go()},
join(){const c=$("#code").value.trim().toUpperCase();if(c)location.hash="#/q/"+c},
track(c){try{localStorage.setItem("qt_"+c,$("#tn").value)}catch(e){}go()}};
function login(u){me=u;try{localStorage.setItem("qs_me",u)}catch(e){}location.hash="#/dash";go()}
function logout(){me=null;try{localStorage.removeItem("qs_me")}catch(e){}location.hash="#/"}

/* views */
const authV=r=>`<a onclick="location.hash='#/'">&larr; Back</a><h1>${r?"Create account":"Log in"}</h1><div class="card col">
${r?'<input id="n" placeholder="Business name"><span class="mut">What are you running?</span><select id="ty">'+Object.keys(PRE).map(k=>'<option>'+k+'</option>').join("")+'</select>':""}<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
<div class="err">${esc(err)}</div><button onclick="A.${r?"reg":"login"}()">${r?"Create account":"Log in"}</button>
<span class="mut">${r?'Have an account? <a onclick="err=\'\';location.hash=\'#/login\'">Log in</a>':'New here? <a onclick="err=\'\';location.hash=\'#/register\'">Create account</a>'}</span></div>`;
const homeV=()=>`<h1>QueueSense</h1><p class="mut">Know the wait before you go. Manage demand while you serve.</p>
<div class="grid"><div class="card col"><h2>I’m a visitor</h2><span class="mut">Enter the office code, or scan its QR.</span>
<input id="code" placeholder="Office code" onkeydown="if(event.key==='Enter')A.join()"><button onclick="A.join()">View queue</button></div>
<div class="card col"><h2>I’m an office worker</h2><span class="mut">Manage tokens and timings.</span>
<button onclick="location.hash='#/login'">Log in</button><button class="alt" onclick="location.hash='#/register'">Create account</button></div></div>`;

function dashV(){const o=me_o();if(!o)return logout(),"";const s=snap(o);
return `<div class="row" style="justify-content:space-between"><h1>${esc(o.name)} <span class="mut" style="font-size:1rem">${esc(o.type||"")}</span></h1><a onclick="logout()">Log out</a></div>
<div class="grid"><div class="card"><div class="mut">Now serving</div><div class="big">${s.serving?"#"+s.serving.num:"-"}</div><button onclick="A.next()">Next token &rarr;</button></div>
<div class="card"><div class="mut">In queue</div><div class="big">${s.list.length}</div></div>
<div class="card"><div class="mut">Wait for a new arrival</div><div class="big">${fmt(s.total)}</div></div>
</div>
<div class="card"><h2>New token</h2><div class="mut">Tap items to build one order, then create the token. Repeat an item for quantities.</div>${o.menu.map(m=>`<button class="chip" onclick="A.add('${m.id}')">${esc(m.name)} &middot; ${m.mins}m &middot; ${m.c||1} counter${(m.c||1)>1?"s":""}</button>`).join("")}
<div class="row" style="margin-top:8px"><input id="cl" placeholder="Custom item"><input id="cm" type="number" min="1" placeholder="min" style="width:90px"><button class="alt" onclick="A.custom()">Add custom</button></div>
<div style="margin-top:10px">${draft.length?draft.map((x,i)=>`<button class="chip" onclick="A.undraft(${i})">${esc(x.name)} &middot; ${x.mins}m &#10005;</button>`).join("")+`<div class="row" style="margin-top:8px"><b>Total: ${fmt(draft.reduce((a,x)=>a+x.mins,0))}</b><button onclick="A.create()">Create token</button><button class="alt" onclick="A.clear()">Clear</button></div>`:'<span class="mut">No items selected yet.</span>'}</div></div>
<div class="grid" style="margin:12px 0"><div class="card col"><h2>Delay switch</h2><span class="mut">Change an item’s time and/or counters (leave one blank to keep it). A new time updates every pending token of that item.</span>
<div class="row"><select id="di">${o.menu.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.mins}m, ${m.c||1} ctr)</option>`).join("")}</select><input id="dm" type="number" min="1" placeholder="new min" style="width:100px"><input id="dc" type="number" min="1" placeholder="counters" style="width:100px"><button onclick="A.delay()">Apply</button></div>
<div class="row"><input id="nn" placeholder="New menu item"><input id="nm" type="number" min="1" placeholder="min" style="width:90px"><input id="nc" type="number" min="1" placeholder="counters" style="width:100px"><button class="alt" onclick="A.item()">Add</button></div></div>
<div class="card col"><h2>Share with visitors</h2><div>Code: <b>${o.code}</b></div><div id="qr"></div>
<button class="alt" onclick="if(confirm('Add 7 days of sample history?'))A.demo()">Load demo history</button></div></div>
<div class="card"><h2>Queue</h2><div class="tw"><table><thead><tr><th>#</th><th>Item</th><th>Time</th><th>Starts in</th><th></th></tr></thead><tbody>
${s.list.map(t=>`<tr><td>#${t.num}</td><td>${esc(t.label)}</td><td><input type="number" min="1" value="${t.mins}" onchange="A.edit('${t.id}',this.value)"> min</td>
<td>${t.status==="serving"?"serving":fmt(t.wait)}</td><td><button class="alt" onclick="A.del('${t.id}')">&#10005;</button></td></tr>`).join("")||'<tr><td colspan="5" class="mut">No tokens yet.</td></tr>'}</tbody></table></div></div>`}
const shareUrl=c=>location.protocol.startsWith("http")?location.href.split("#")[0]+"#/q/"+c:c;

function visV(c){const o=off(c);if(!o)return `<a onclick="location.hash='#/'">&larr; Home</a><div class="card"><h2>Office not found</h2><span class="mut">Check the code. This demo stores data in your browser, so open it on the same device as the worker.</span></div>`;
const s=snap(o);let t="";try{t=localStorage.getItem("qt_"+c)||""}catch(e){}t=+t;
let me_h='<span class="mut">Enter your token number to see your estimated wait.</span>';
if(t){const m=s.list.find(x=>x.num===t);
if(m&&m.status==="serving")me_h=`<div class="big" style="color:var(--ok)">It’s your turn!</div>Your turn would be ${fmt(m.eff)} long.`;
else if(m)me_h=`<div class="mut">Your turn starts in</div><div class="big">${fmt(m.wait)}</div>${s.list.filter(x=>x.num<t).length} ahead of you<br><span class="mut">Your turn would be ${fmt(m.eff)} long</span>`;
else if(t<=(o.last||0))me_h=`Token #${t} has been served (or cancelled).`;else me_h=`Token #${t} has not been issued yet.`}
const h=hours(o),mx=Math.max(...h,1),hrs=[...Array(16)].map((_,i)=>i+6),now=new Date().getHours();
const quiet=hrs.filter(i=>h[i]>0).sort((a,b)=>h[a]-h[b]).slice(0,3),f=i=>(i%12||12)+(i<12?"am":"pm");
return `<a onclick="location.hash='#/'">&larr; Home</a><h1>${esc(o.name)}</h1>
<div class="grid"><div class="card"><div class="mut">Now serving</div><div class="big">${s.serving?"#"+s.serving.num:"-"}</div></div>
<div class="card"><div class="mut">People in queue</div><div class="big">${s.list.length}</div></div>
<div class="card"><div class="mut">Wait if you join now</div><div class="big">${fmt(s.total)}</div></div></div>
<div class="card"><h2>Your token</h2><div class="row"><input id="tn" type="number" min="1" placeholder="Token number" value="${t||""}"><button onclick="A.track('${c}')">Track</button></div><div style="margin-top:10px">${me_h}</div></div>
<div class="card"><h2>Best time to visit</h2><div class="mut">${quiet.length?"Quietest around "+quiet.slice().sort((a,b)=>a-b).map(f).join(", ")+".":"Not enough history yet. It builds up as tokens are issued."}</div>
<div class="bars" style="margin-top:8px">${hrs.map(i=>`<div class="${quiet.includes(i)?"q":""} ${i===now?"now":""}" style="height:${Math.max(3,h[i]/mx*100)}%" title="${f(i)}: ${h[i]} tokens/day"></div>`).join("")}</div>
<div class="lbl">${hrs.map(i=>`<span>${i}</span>`).join("")}</div>
<p class="mut" style="font-size:.85rem">Green = quietest hours (average tokens per day, last 14 days). Outlined = now.</p></div>`}

function go(){ld();const h=location.hash||"#/",p=h.split("/");let v;
if(h.startsWith("#/q/"))v=visV(decodeURIComponent(p[2]||"").toUpperCase());
else if(h==="#/login")v=authV(0);else if(h==="#/register")v=authV(1);
else if(h==="#/dash")v=me&&S.workers[me]?dashV():(location.hash="#/login",authV(0));
else v=homeV();
app.innerHTML=v;const q=$("#qr");if(q&&window.qrcode){try{const z=qrcode(0,"M");z.addData(shareUrl(me_o().code));z.make();q.style.cssText="background:#fff;padding:8px;border-radius:10px;width:fit-content;line-height:0";q.innerHTML=z.createSvgTag(5,2)}catch(e){}}}
addEventListener("hashchange",()=>{err="";go()});
addEventListener("storage",e=>{if(e.key===K)go()});
setInterval(()=>{const a=document.activeElement;if(!a||!/INPUT|SELECT/.test(a.tagName))go()},3000);
go();
</script></body></html>
